<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عبدالرحمن محمد للكاميرات</title>
    <style>
        body { font-family: Tahoma; background: #f0f0f0; text-align: center; }
        h1 { color: #1e3a8a; margin-top: 20px; }
        .product {
            background: white;
            border-radius: 15px;
            display: inline-block;
            margin: 15px;
            padding: 15px;
            width: 220px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .product img { width: 200px; height: 200px; border-radius: 10px; }
        .name { font-size: 18px; font-weight: bold; margin: 10px 0; }
        .price { font-size: 20px; color: #27ae60; font-weight: bold; }
        .phone { font-size: 22px; color: #c0392b; margin: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📷 عبدالرحمن محمد للكاميرات 📷</h1>
    <h3>كل ما يخص كاميرات المراقبة</h3>
    <div class="phone">📞 01118704567</div>
    
    {% for product in products %}
    <div class="product">
        <img src="{{ product.img }}" alt="{{ product.name }}">
        <div class="name">{{ product.name }}</div>
        <div class="price">{{ product.price }}</div>
    </div>
    {% endfor %}
</body>
</html>
